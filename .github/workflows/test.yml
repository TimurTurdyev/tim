name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go vet ./...
      - run: go test -race ./...
      - run: GOOS=linux go build ./...
      - run: GOOS=darwin go build ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11
