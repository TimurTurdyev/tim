version: 2

project_name: tim

before:
  hooks:
    - go mod tidy
    - go test ./...
    - go run -ldflags "-X github.com/TimurTurdyev/tim/cmd.version={{ .Tag }}" ./tools/genman man

builds:
  - id: darwin
    main: .
    binary: tim
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/TimurTurdyev/tim/cmd.version={{ .Tag }}
  - id: linux
    main: .
    binary: tim
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/TimurTurdyev/tim/cmd.version={{ .Tag }}

# На macOS один универсальный бинарник на обе архитектуры, на Linux - по архиву на архитектуру.
universal_binaries:
  - id: darwin
    replace: true

archives:
  - id: darwin
    ids: [darwin]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin_all"
    files:
      - README.md
      - man/*.1
  - id: linux
    ids: [linux]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_linux_{{ .Arch }}"
    files:
      - README.md
      - man/*.1

checksum:
  name_template: checksums.txt

release:
  github:
    owner: TimurTurdyev
    name: tim

changelog:
  sort: asc
  filters:
    exclude: ["^docs", "^test", "^chore"]

homebrew_casks:
  - name: tim
    ids: [darwin]
    repository:
      owner: TimurTurdyev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/TimurTurdyev/tim
    description: Developer control panel for the terminal
    binaries: [tim]
    manpages: [man/tim.1]
    # Бинарник не подписан и не нотаризован: без снятия карантина Gatekeeper его не запустит.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tim"]
          end
