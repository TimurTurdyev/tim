# Пример ~/.config/tim/config.toml со всеми разделами. Адреса и имена выдуманы.
# Конфиг не обязателен: без него работают значения по умолчанию. Цели обхода дописывает tim direct.
# tim переписывает конфиг сам, комментарии при этом пропадают; прежняя версия остаётся в config.toml.bak.

dev = "/Users/me/Dev"   # папка с кодом: здесь tim disk ищет node_modules, vendor и сборки
motd = ["system", "net", "ports"]   # разделы tim status по умолчанию: system, net, ports, services,
                                    # procs, versions

# Сайты для обхода: tim check, экран Сайты, tim cert без аргументов, tim mail --all.
sites = ["shop.example.com", "example.com"]

[shell]                 # что добавляет tim init zsh
  motd = true           # сводка при открытии терминала

[shell.aliases]
  gs = "git status -sb"

[tunnel]                # tim tunnel без аргументов
  host = "prod"         # сервер: алиас из ~/.ssh/config
  port = 1080           # порт SOCKS на 127.0.0.1

[[recipe]]              # своя заготовка сервера: палитра ":" и tim server <алиас> --run disk-www
  name = "disk-www"
  desc = "место по сайтам"
  run = "du -sh /var/www/* | sort -rh | head"   # {server} и {unit} подставляются

[notify]                # итог обхода по расписанию: только новое и серьёзное
  telegram = "123456:ABC..."   # токен бота от @BotFather
  chat = "123456789"           # кому писать
  ntfy = "https://ntfy.sh/my-topic"

# Цели обхода VPN. Заводятся командой tim direct, убираются tim direct rm. Страж маршрутов
# (sudo tim route install) перечитывает их каждые 10 секунд и держит маршруты живыми.
[[host]]
  addr = "203.0.113.5"        # адрес: маршрут на него одного
  label = "prod"              # пометка: tim direct rm prod уберёт все цели с ней

[[host]]
  addr = "198.51.100.0/24"    # подсеть
  label = "office"

[[host]]
  addr = "git.example.com"    # домен: все его адреса из DNS на момент проверки

[[host]]
  addr = "as:64500"           # все сети компании по номеру AS; список из RIPE, обновляется раз в сутки
  label = "example.com"

# Серверы tim берёт из ~/.ssh/config: все Host, кроме git-хостов.
# Старые [[project]], [[task]], [[template]], [groups], wrapper, editor и shell.cd_info tim больше
# не читает; tim doctor скажет, какие из них остались.
